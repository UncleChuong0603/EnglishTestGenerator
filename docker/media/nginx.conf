limit_req_zone $binary_remote_addr zone=media_per_ip:10m rate=20r/s;

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 1m;

  # Resolve the app service at request time so rolling container replacements
  # do not leave nginx pointing at the previous container IP.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $app_upstream http://app:3000;

  location = /api/media/local {
    limit_req zone=media_per_ip burst=40 nodelay;
    proxy_pass $app_upstream;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /protected-media/ {
    internal;
    alias /srv/media/;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "private, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
  }
}
