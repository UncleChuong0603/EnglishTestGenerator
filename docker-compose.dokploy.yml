name: toeicgym

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Common runtime environment shared by app/migrate/db-tools.
# Do not put payment-provider secrets here because migrate/db-tools
# do not need access to them.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  # Optional: local email/password authentication remains available without Google.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-TOEICGym <noreply@toeicgym.net>}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
  MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-R2}
  LOCAL_MEDIA_ROOT: ${LOCAL_MEDIA_ROOT:-/var/lib/toeicgym/media}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}

services:
  media-init:
    image: alpine:3.22
    restart: "no"
    command: ["/bin/sh", "-ec", "chown -R 1001:1001 /var/lib/toeicgym/media && chmod 0755 /var/lib/toeicgym/media"]
    volumes:
      - media_data:/var/lib/toeicgym/media
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  preflight:
    image: alpine:3.22
    restart: "no"
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?APP_DATABASE_USER is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required}
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-R2}
      LOCAL_MEDIA_ROOT: ${LOCAL_MEDIA_ROOT:-/var/lib/toeicgym/media}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    command:
      - /bin/sh
      - -ec
      - |
        test "$${POSTGRES_ADMIN_USER}" != "$${APP_DATABASE_USER}"
        test "$${POSTGRES_ADMIN_PASSWORD}" != "$${APP_DATABASE_PASSWORD}"
        test "$${#POSTGRES_ADMIN_PASSWORD}" -ge 24
        test "$${#APP_DATABASE_PASSWORD}" -ge 24
        key_bytes="$$(printf '%s' "$${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}" | base64 -d | wc -c)"
        case "$${key_bytes}" in 16|24|32) ;; *) exit 1 ;; esac
        if [ "$${MEDIA_ENABLED}" = "true" ] && [ "$${MEDIA_STORAGE_PROVIDER}" = "R2" ]; then
          test -n "$${R2_ACCOUNT_ID}"
          test -n "$${R2_ACCESS_KEY_ID}"
          test -n "$${R2_SECRET_ACCESS_KEY}"
          test -n "$${R2_BUCKET_NAME}"
          case "$${R2_ENDPOINT}" in https://*) ;; *) exit 1 ;; esac
        fi
        if [ "$${MEDIA_ENABLED}" = "true" ] && [ "$${MEDIA_STORAGE_PROVIDER}" = "LOCAL" ]; then
          test -n "$${LOCAL_MEDIA_ROOT}"
          test "$${#MEDIA_SIGNING_SECRET}" -ge 32
        fi
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?APP_DATABASE_USER is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  app:
    build:
      context: .
      target: runner
      secrets:
        - next_server_actions_encryption_key
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    environment:
      <<: *app-environment

      # Payment configuration — app runtime only.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-PAYOS}

      # Server-only payOS credentials.
      # Keep optional so TOEICGym can boot with checkout disabled.
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}

      # Optional product pricing.
      # Missing prices intentionally keep checkout disabled.
      PREMIUM_30_PRICE_VND: ${PREMIUM_30_PRICE_VND:-}
      PREMIUM_90_PRICE_VND: ${PREMIUM_90_PRICE_VND:-}
      PREMIUM_365_PRICE_VND: ${PREMIUM_365_PRICE_VND:-}

    depends_on:
      media-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    expose: ["3000"]
    volumes:
      - media_data:/var/lib/toeicgym/media

    labels:
      traefik.enable: "true"

      traefik.http.services.toeicgym-app.loadbalancer.server.port: "3000"

      traefik.http.middlewares.toeicgym-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.toeicgym-https.redirectscheme.permanent: "true"

      traefik.http.routers.toeicgym-web.rule: "Host(`toeicgym.net`)"
      traefik.http.routers.toeicgym-web.entrypoints: "web"
      traefik.http.routers.toeicgym-web.middlewares: "toeicgym-https"
      traefik.http.routers.toeicgym-web.service: "toeicgym-app"
      traefik.http.routers.toeicgym-web.priority: "100"

      traefik.http.routers.toeicgym-websecure.rule: "Host(`toeicgym.net`)"
      traefik.http.routers.toeicgym-websecure.entrypoints: "websecure"
      traefik.http.routers.toeicgym-websecure.service: "toeicgym-app"
      traefik.http.routers.toeicgym-websecure.priority: "100"
      traefik.http.routers.toeicgym-websecure.tls: "true"
      traefik.http.routers.toeicgym-websecure.tls.certresolver: "letsencrypt"

      traefik.http.middlewares.toeicgym-www-canonical.redirectregex.regex: "^https?://www\\.toeicgym\\.net/(.*)"
      traefik.http.middlewares.toeicgym-www-canonical.redirectregex.replacement: "https://toeicgym.net/$${1}"
      traefik.http.middlewares.toeicgym-www-canonical.redirectregex.permanent: "true"

      traefik.http.routers.toeicgym-www-canonical-web.rule: "Host(`www.toeicgym.net`)"
      traefik.http.routers.toeicgym-www-canonical-web.entrypoints: "web"
      traefik.http.routers.toeicgym-www-canonical-web.middlewares: "toeicgym-www-canonical"
      traefik.http.routers.toeicgym-www-canonical-web.service: "noop@internal"
      traefik.http.routers.toeicgym-www-canonical-web.priority: "100"

      traefik.http.routers.toeicgym-www-canonical-websecure.rule: "Host(`www.toeicgym.net`)"
      traefik.http.routers.toeicgym-www-canonical-websecure.entrypoints: "websecure"
      traefik.http.routers.toeicgym-www-canonical-websecure.middlewares: "toeicgym-www-canonical"
      traefik.http.routers.toeicgym-www-canonical-websecure.service: "noop@internal"
      traefik.http.routers.toeicgym-www-canonical-websecure.priority: "100"
      traefik.http.routers.toeicgym-www-canonical-websecure.tls: "true"
      traefik.http.routers.toeicgym-www-canonical-websecure.tls.certresolver: "letsencrypt"

    networks: [frontend, database]

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    security_opt: [no-new-privileges:true]
    logging: *default-logging

  media-server:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - media_data:/srv/media:ro
      - ./docker/media/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["8080"]
    labels:
      traefik.enable: "true"
      traefik.http.services.toeicgym-media.loadbalancer.server.port: "8080"
      traefik.http.routers.toeicgym-media.rule: "Host(`toeicgym.net`) && Path(`/api/media/local`)"
      traefik.http.routers.toeicgym-media.entrypoints: "websecure"
      traefik.http.routers.toeicgym-media.service: "toeicgym-media"
      traefik.http.routers.toeicgym-media.priority: "200"
      traefik.http.routers.toeicgym-media.tls: "true"
      traefik.http.routers.toeicgym-media.tls.certresolver: "letsencrypt"
    networks: [frontend]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  db-tools:
    build:
      context: .
      target: database-tools
    profiles: [tools]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/toeicgym/media
    networks: [database, frontend]
    restart: "no"
    security_opt: [no-new-privileges:true]

networks:
  frontend:
    name: dokploy-network
    external: true

  database:
    internal: true

volumes:
  postgres_data:
    name: toeicgym_postgres_data
  media_data:
    name: toeicgym_media_data

secrets:
  next_server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
